# ─────────────────────────────────────────────
# catalog  (Spring Boot — port 8080)
# ─────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: catalog
  namespace: cloudcart
spec:
  replicas: 2
  selector:
    matchLabels:
      app: catalog
  template:
    metadata:
      labels:
        app: catalog
    spec:
      containers:
      - name: catalog
        image: 264765155226.dkr.ecr.ap-south-1.amazonaws.com/catalog:latest
        ports:
        - containerPort: 8080
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: catalog
  namespace: cloudcart
spec:
  selector:
    app: catalog
  ports:
  - port: 8080
    targetPort: 8080
---
