<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CloudCart</title>
  <link rel="icon" href="data:,">
  <style>
    body { font-family: Arial, sans-serif; margin: 0; background: #f8fafc; color: #0f172a; }
    nav { background: #0f172a; color: #fff; padding: 16px 24px; display: flex; justify-content: space-between; align-items: center; }
    .hero { background: linear-gradient(135deg, #2563eb, #7c3aed); color: #fff; padding: 48px 24px; text-align: center; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 20px; padding: 24px; }
    .card { background: #fff; border-radius: 14px; padding: 20px; box-shadow: 0 6px 20px rgba(0,0,0,.08); }
    button { background: #22c55e; color: #fff; border: none; padding: 10px 14px; border-radius: 8px; cursor: pointer; }
    button:hover { background: #16a34a; }
    .message { padding: 24px; text-align: center; color: #475569; font-size: 18px; }
    .badge { display: inline-block; background: #2563eb; color: #fff; border-radius: 6px; padding: 2px 8px; font-size: 12px; margin-bottom: 8px; }
  </style>
</head>
<body>
  <nav>
    <strong>CloudCart</strong>
    <span>Microservices on EKS &mdash; Java + Spring Boot</span>
  </nav>

  <section class="hero">
    <h1>CloudCart on Amazon EKS</h1>
    <p>Docker + Kubernetes + Terraform + Prometheus + Spring Boot</p>
  </section>

  <div id="message" class="message">Loading products...</div>
  <div id="products" class="grid"></div>

  <script>
    fetch('/api/catalog/products')
      .then(response => {
        if (!response.ok) throw new Error('HTTP error: ' + response.status);
        return response.json();
      })
      .then(products => {
        document.getElementById('message').style.display = 'none';
        document.getElementById('products').innerHTML = products.map(product => `
          <div class="card">
            <div class="badge">Spring Boot</div>
            <h3>${product.name}</h3>
            <p>&#8377;${product.price}</p>
            <button onclick="addToCart(${product.id}, '${product.name}', ${product.price})">
              Add to Cart
            </button>
          </div>
        `).join('');
      })
      .catch(error => {
        document.getElementById('message').innerText =
          'Could not load products. Check if catalog service is running on /api/catalog/products';
        console.error(error);
      });

    function addToCart(id, name, price) {
      fetch('/api/cart/items', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ id, name, price })
      })
      .then(r => r.json())
      .then(data => alert('Added to cart! Items in cart: ' + data.cart.length))
      .catch(err => console.error('Cart error:', err));
    }
  </script>
</body>
</html>
